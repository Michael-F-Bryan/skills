<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title><!-- Artefact title --></title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap" />
  <link rel="stylesheet" href="../assets/css/web-base.css" />
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="site-mark" href="https://www.michaelfbryan.com">Michael F. Bryan <span class="slash">/</span> <span class="area"><!-- Area --></span></a>
    </div>
  </header>

  <main class="entry">
    <div class="container entry-grid">
      <header class="entry-header">
        <span class="label label--muted"><!-- Decision brief / explainer / report / review --></span>
        <h1 class="page-title"><!-- First-screen answer, not a vague topic label --></h1>
        <div class="prose prose--xl">
          <p><!-- The primary question and its answer in one or two sentences. --></p>
        </div>
      </header>

      <nav class="toc" aria-label="On this page">
        <span class="label label--muted">On this page</span>
        <ol>
          <li><a href="#current-read">Current read</a></li>
          <li><a href="#what-changes">What this changes</a></li>
          <li><a href="#evidence">Evidence and uncertainty</a></li>
          <li><a href="#next-move">Next move</a></li>
        </ol>
      </nav>

      <article class="entry-article stack">
        <section class="band band--surface" aria-labelledby="current-read">
          <span class="label">Current read</span>
          <h2 class="section-title" id="current-read" style="margin-top: 1rem"><!-- Recommendation as a sentence --></h2>
          <div class="prose prose--xl" style="margin-top: 1.75rem">
            <p><!-- BLUF: what matters most and why. --></p>
          </div>
        </section>

        <section class="section" aria-labelledby="what-changes">
          <span class="label"><!-- Kicker --></span>
          <h2 class="section-title" id="what-changes">What this changes</h2>
          <div class="section-body">
            <div class="prose"><p><!-- Context in one paragraph. --></p></div>
            <dl class="rows" style="margin-top: 2.5rem">
              <div><dt><!-- Term --></dt><dd><!-- What changes for it --></dd></div>
              <div><dt><!-- Term --></dt><dd><!-- What changes for it --></dd></div>
              <div><dt><!-- Term --></dt><dd><!-- What changes for it --></dd></div>
            </dl>
          </div>
        </section>

        <section class="section" aria-labelledby="evidence">
          <span class="label">Evidence</span>
          <h2 class="section-title" id="evidence">Evidence and uncertainty</h2>
          <div class="section-body">
            <div class="prose"><p><!-- Put measured/default/inferred/assumed provenance beside claims. --></p></div>
            <p class="note note--warning" style="margin-top: 2.5rem">
              <span class="label" style="color: var(--warning)">Risk</span>
              <!-- The main caveat, stated plainly. -->
            </p>
          </div>
        </section>

        <section class="section" aria-labelledby="next-move">
          <span class="label">Next move</span>
          <h2 class="section-title" id="next-move"><!-- What happens next --></h2>
          <div class="section-body">
            <ol class="steps">
              <li><strong class="step-title"><!-- Action --></strong><span class="step-body"><!-- Owner, date, detail --></span></li>
              <li><strong class="step-title"><!-- Action --></strong><span class="step-body"><!-- Owner, date, detail --></span></li>
            </ol>
          </div>
        </section>
      </article>
    </div>
  </main>
</body>
</html>
